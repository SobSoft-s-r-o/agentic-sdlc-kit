# Publishes the package to npm when a version tag (v*) is pushed.
# Trusted publishing (OIDC): npm trusts this workflow file, so no npm token is stored in the repository.
# Owner setup, once: publish the first version by hand, then
#   npm trust github agentic-sdlc-kit --file release.yml --repo SobSoft-s-r-o/agentic-sdlc-kit --allow-publish
# A version that is already on npm is skipped, so a re-run of a tag is harmless.
# Actions are pinned to a full commit SHA (the tag in the comment), so a moved tag cannot change what runs.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for trusted publishing: the job asks GitHub for an OIDC token that npm exchanges for a publish credential.
      id-token: write
    steps:
      # persist-credentials: false: the checkout token is not left in .git/config for the later steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11, which trusted publishing needs. No dependency cache in a release build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the npm version
        run: |
          npm_version="$(npm --version)"
          if ! printf '%s\n' 11.5.1 "$npm_version" | sort -V -C; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi
          echo "npm $npm_version"
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match package.json, which says $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Check whether this version is already on npm
        id: published
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "agentic-sdlc-kit@$V" version >/dev/null 2>&1; then
            echo "agentic-sdlc-kit@$V is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # `npm publish` runs the package's `prepare` script (tsc), so it ships a fresh build.
      # publishConfig in package.json sets access public and provenance.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish
